<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed</title>
    <link rel="stylesheet" href="../../../styles/stylesfeed.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Explore!</h1>
            <p>Connect with the community</p>
        </div>

        <div class="grid">
            <div class="card">

                <img src="../../../imagesfeed/sanandreas.jpg" class="card-img">

                <div class="card-content">

                    <div class="user">
                        <img src="../../../imagesprofile/camilorodriguez.jpg" class="profile-img">
                        <h3>Camilo Rodriguez</h3>
                    </div>

                    <p class="text">Nunca me canso de jugarlo, las misiones y los mapas son otro nivel</p>

                    <div class="bottom">

                        <div class="icons">
                            <i class="fa-regular fa-heart"></i>
                            <i class="fa-regular fa-comment"></i>
                            <i class="fa-regular fa-bookmark"></i>
                        </div>

                        <div class="stars">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                        </div>

                    </div>

                </div>

            </div>
            <div class="card">

                <img src="../../../imagesfeed/fortnite.png" class="card-img">

                <div class="card-content">

                    <div class="user">
                        <img src="../../../imagesprofile/alexflorez.jpg" class="profile-img">
                        <h3>Alex Flores</h3>
                    </div>

                    <p class="text">
                        Super divertido para jugar con amigos
                    </p>

                    <div class="bottom">

                        <div class="icons">
                            <i class="fa-regular fa-heart"></i>
                            <i class="fa-regular fa-comment"></i>
                            <i class="fa-regular fa-bookmark"></i>
                        </div>

                        <div class="stars">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                        </div>

                    </div>

                </div>

            </div>

            <div class="card">

                <img src="../../../imagesfeed/callofduty.png" class="card-img">

                <div class="card-content">

                    <div class="user">
                        <img src="../../../imagesprofile/davidmejia.jpg" class="profile-img">
                        <h3>David Mejía</h3>
                    </div>

                    <p class="text">
                        Pura adrenalina de principio a fin
                    </p>

                    <div class="bottom">

                        <div class="icons">
                            <i class="fa-regular fa-heart"></i>
                            <i class="fa-regular fa-comment"></i>
                            <i class="fa-regular fa-bookmark"></i>
                        </div>

                        <div class="stars">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                        </div>

                    </div>

                </div>
            </div>
            <div class="card">

                <img src="../../../imagesfeed/robots.png" class="card-img">

                <div class="card-content">

                    <div class="user">
                        <img src="../../../imagesprofile/catalinaperez.jpg" class="profile-img">
                        <h3>Catalina Pérez</h3>
                    </div>

                    <p class="text">
                        Batallas epicas con robots brutales
                    </p>

                    <div class="bottom">

                        <div class="icons">
                            <i class="fa-regular fa-heart"></i>
                            <i class="fa-regular fa-comment"></i>
                            <i class="fa-regular fa-bookmark"></i>
                        </div>

                        <div class="stars">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                        </div>

                    </div>

                </div>

            </div>
        </div>
        <script src="scriptfeed.js"></script>
</body>

</html>
